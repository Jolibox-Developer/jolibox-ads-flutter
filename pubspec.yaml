name: jolibox_ads_flutter
description: Flutter bridge for Jolibox Host Ads; Android is the current delivery target and iOS is pending acceptance.
version: 0.2.0
homepage: https://jolibox.com

environment:
  sdk: ^3.0.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.jolibox.android.sdk.ads.flutter
        pluginClass: JoliboxAdsFlutterPlugin
      ios:
        pluginClass: JoliboxAdsFlutterPlugin
