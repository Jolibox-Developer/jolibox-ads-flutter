name: jolibox_ads_flutter
description: Flutter bridge for Jolibox Host Ads on Android and iOS through Swift Package Manager.
version: 0.4.0
homepage: https://jolibox.com

environment:
  sdk: ^3.0.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.jolibox.android.sdk.ads.flutter
        pluginClass: JoliboxAdsFlutterPlugin
      ios:
        pluginClass: JoliboxAdsFlutterPlugin
