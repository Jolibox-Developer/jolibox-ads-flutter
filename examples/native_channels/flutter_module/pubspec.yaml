name: jolibox_native_channels
description: Shared Flutter module for native optional ad bridge verification.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  jolibox_ads_flutter:
    path: ../../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  module:
    androidX: true
    androidPackage: com.jolibox.examples.jolibox_native_channels
    iosBundleIdentifier: com.jolibox.examples.joliboxNativeChannels
