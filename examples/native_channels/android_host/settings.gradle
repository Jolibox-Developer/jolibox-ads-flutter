pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.android.application" version "8.6.1" apply false
    id "com.android.library" version "8.6.1" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Both channel variants resolve precisely the same prebuilt Flutter module.
        maven { url = uri("../flutter_module/build/host/outputs/repo") }
        maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
        maven { url = uri("https://raw.githubusercontent.com/Jolibox-Developer/jolibox-ad-mediation-android-maven/0.6.2/") }
        if (providers.gradleProperty("adBridgeMavenRepository").isPresent()) {
            maven { url = uri(providers.gradleProperty("adBridgeMavenRepository").get()) }
        }
    }
}

rootProject.name = "jolibox_native_channel_android_host"
include ":app", ":adBridge"
project(":adBridge").projectDir = file("../../../native/android")
