plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.jolibox.examples.nativechannelshost"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.jolibox.examples.nativechannelshost"
        minSdk = 23
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    flavorDimensions += "ads"
    productFlavors {
        base { dimension = "ads"; applicationIdSuffix = ".base" }
        admob { dimension = "ads"; applicationIdSuffix = ".admob" }
    }

    buildTypes {
        release {
            // Example is locally installable without signing credentials.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // Only this artifact changes by build mode, never by channel flavor.
    debugImplementation("com.jolibox.examples.jolibox_native_channels:flutter_debug:1.0")
    releaseImplementation("com.jolibox.examples.jolibox_native_channels:flutter_release:1.0")
    if (providers.gradleProperty("adBridgeMavenRepository").isPresent()) {
        admobImplementation("com.jolibox.admediation:jolibox-ads-flutter-bridge-admob:0.8.1")
    } else {
        admobImplementation project(":adBridge")
    }
}
